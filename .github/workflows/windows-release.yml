name: Windows Fork Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v0.7.3-fork.1"
        required: true
        default: "v0.7.3-fork.1"
      draft:
        description: "Create the GitHub release as a draft"
        required: true
        type: boolean
        default: false

jobs:
  windows-release:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: windows-fork-release

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "Terax Fork ${{ inputs.tag }}"
          releaseBody: "Windows installer built from this fork. Download the .exe from Assets. This build is unsigned, so Windows may show a SmartScreen warning."
          releaseDraft: ${{ inputs.draft }}
          prerelease: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: "--bundles nsis --config src-tauri/tauri.fork-release.conf.json"
